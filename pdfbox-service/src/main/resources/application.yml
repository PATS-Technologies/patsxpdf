server:
  port: 8080
  shutdown: graceful
spring:
  servlet:
    multipart:
      max-file-size: ${OCR_MAX_UPLOAD_MB:100}MB
      max-request-size: ${OCR_MAX_UPLOAD_MB:100}MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
pdfbox:
  jobs-path: ${ENGINE_JOBS_PATH:/data/jobs}
  api-token: ${ENGINE_API_TOKEN:development-only-change-me}
  dpi: ${OCR_DPI:300}
  workers: ${OCR_WORKERS:1}
  tesseract-timeout-seconds: ${OCR_PAGE_TIMEOUT_SECONDS:180}
