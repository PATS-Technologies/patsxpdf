#
# PATSXPDF compose file
# (c) PATS Technologies
#
networks:
  pats-production:
    name: pats-production
    external: true

x-basic-container:
  &basic-container
  restart: unless-stopped
  networks:
    - pats-production

services:
  #
  # One-shot services
  #
  font-catalog:
    image: patsxpdf-fonts:${PATSXPDF_VERSION:?Set PATSXPDF_VERSION}
    pull_policy: never
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "fc-list --format='%{family}\\n' | sort -fu > /font-data/families.txt && chmod 644 /font-data/families.txt"
    volumes:
      - ${FONTS_PATH:-/usr/share/fonts/truetype/pats}:/usr/local/share/fonts/truetype/pats:ro
      - font-catalog:/font-data

  migrate:
    image: patsxpdf-migrate:${PATSXPDF_VERSION:?Set PATSXPDF_VERSION}
    pull_policy: never
    networks:
      - pats-production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pats}
      POSTGRES_USER: ${POSTGRES_USER:-pats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGHOST: ${POSTGRES_HOST:-pats-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-pats}
      PGUSER: ${POSTGRES_USER:-pats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGOPTIONS: "-c search_path=patsxpdf"
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-patsxpdf}
    command:
      - "/bin/bash"
      - "-ec"
      - "/bin/bash /provision-db.sh && /bin/sh /migrate.sh"
    volumes:
      - ./db/init:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/provision-db.sh:/provision-db.sh:ro

  #
  # Long-running services
  # 
  office:
    <<: [*basic-container]
    image: patsxpdf-office:${PATSXPDF_VERSION:?Set PATSXPDF_VERSION}
    pull_policy: never
    container_name: patsxpdf-office
    depends_on:
      font-catalog:
        condition: service_completed_successfully
    command:
      - "gotenberg"
      - "--api-timeout=${OFFICE_CONVERTER_TIMEOUT:-120s}"
      - "--api-body-limit=${MAX_UPLOAD_MB:-100}MB"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ${FONTS_PATH:-/usr/share/fonts/truetype/pats}:/usr/local/share/fonts/truetype/pats:ro

  engine:
    <<: [*basic-container]
    image: patsxpdf-engine:${PATSXPDF_VERSION:?Set PATSXPDF_VERSION}
    pull_policy: never
    container_name: patsxpdf-engine
    environment:
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:-development-only-change-me}
      OCR_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_WORKERS: ${OCR_WORKERS:-1}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-180}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ocr-data:/data/jobs
  
  app:
    <<: [*basic-container]
    image: patsxpdf-app:${PATSXPDF_VERSION:?Set PATSXPDF_VERSION}
    pull_policy: never
    container_name: patsxpdf-app
    depends_on:
      font-catalog:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      office:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-pats-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-pats}
      PGUSER: ${POSTGRES_USER:-pats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-troque-esta-chave-em-producao}
      PDF_STORAGE: /data/pdfs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      OFFICE_CONVERTER_URL: http://office:3000
      OFFICE_CONVERTER_TIMEOUT_MS: ${OFFICE_CONVERTER_TIMEOUT_MS:-120000}
      OFFICE_FONT_CATALOG: /data/font-catalog/families.txt
      ENGINE_SERVICE_URL: http://engine:8080
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:-development-only-change-me}
      ENGINE_REQUEST_TIMEOUT_MS: ${ENGINE_REQUEST_TIMEOUT_MS:-300000}
      PATSCOMPARE_URL: ${PATSCOMPARE_URL:-http://patscompare-app:3000}
      PATSCOMPARE_PUBLIC_URL: ${PATSCOMPARE_PUBLIC_URL:-}
    ports:
      - "${APP_PORT:-3002}:3000"
    volumes:
      - pdf-data:/data/pdfs
      - font-catalog:/data/font-catalog:ro

volumes:
  pdf-data:
  font-catalog:
  ocr-data:
